name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      # No services are declared on purpose. The suite signs its own tokens and runs
      # against SQLite, so a job that needed PostgreSQL or Keycloak would mean the
      # hermetic property had been lost. See .agents/playbooks/testing.md.
      - name: Run tests
        run: uv run pytest -q
