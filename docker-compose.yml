services:
  api:
    build:
      context: ./
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      # No development default: unset is hardened (celine.sdk.posture).
      # celine-dev's docker tasks export CELINE_ENV=dev for the local stack.
      CELINE_ENV: ${CELINE_ENV:-}
    ports:
      - "8014:8014"
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "keycloak.celine.localhost:host-gateway"
      - "api.celine.localhost:host-gateway"
